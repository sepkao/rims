services:
  - type: web
    name: rims-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "5000"
      # Secrets — set the real values in the Render dashboard after the first
      # deploy (Environment tab). Never commit real values here.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
