name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # A plain actions/checkout leaves extra refs lying around (origin/main,
      # origin/Achiraya, ...) that aren't real branches — `git push --mirror` from
      # inside that checkout tries to push those too and GitLab rejects the whole
      # push ("deny updating a hidden ref"). A fresh bare mirror clone only ever has
      # the real refs/heads and refs/tags from the source, nothing extra to leak.
      - name: Mirror clone from GitHub
        run: git clone --mirror https://github.com/${{ github.repository }}.git repo-mirror

      - name: Push mirror to GitLab
        working-directory: repo-mirror
        run: git push --mirror https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/sepkao/rims.git
