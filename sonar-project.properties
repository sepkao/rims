sonar.projectKey=sepkao_rims
sonar.organization=sepkao

sonar.sources=apps
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.tsbuildinfo
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
# No test framework is wired up for the frontend apps yet, so Sonar would
# otherwise score every new frontend line as 0% covered. Exclude them from
# the coverage metric (not from analysis - bugs/smells there still get
# flagged) until apps/internal and apps/customer have their own tests.
# Test files are excluded for a different reason: nothing covers a test but
# itself, so counting them as lines needing coverage fails the gate on any
# commit that adds one.
sonar.coverage.exclusions=apps/internal/**,apps/customer/**,**/*.test.mjs,**/*.test.ts,e2e/**
